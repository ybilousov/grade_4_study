<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virginia Studies Practice</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#2b2a27;--muted:#7a766d;--accent:#8a4b2a;--good:#3f7d4e;--warn:#b5651d;--line:#e4dfd4}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:1.1rem;margin:0}
h2{margin:0 0 12px;font-size:1.1rem}
h3{margin:0 0 6px;font-size:1rem}
.wrap{max-width:820px;margin:0 auto;padding:20px}
button,.btnlike{font:inherit;border:0;border-radius:8px;padding:9px 16px;background:var(--accent);color:#fff;cursor:pointer;display:inline-block}
button:hover,.btnlike:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.good{background:var(--good)}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.between{justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--muted);padding:7px 12px}
.tabs button.on{background:var(--accent);color:#fff}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pcard{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pick{flex:1;background:transparent;color:var(--ink);text-align:left;display:flex;align-items:center;gap:10px;padding:14px;border-radius:0}
.pick:hover{background:#faf7f1}
.pick small{display:block;color:var(--muted)}
.del{background:transparent;color:var(--muted);padding:0 12px;border-radius:0}
.avatar{width:38px;height:38px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.9rem;margin:10px 0}
.tag{background:#efe6da;color:var(--accent);padding:3px 8px;border-radius:6px;font-weight:600;font-size:.85rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--good)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px;min-height:240px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.text{font-size:1.2rem;line-height:1.5;margin:0 0 14px}
.hint{color:var(--muted);font-style:italic;margin:0 0 14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.topic .top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.topic .actions{margin-top:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{font-size:1.5rem;display:block}
.stat span{color:var(--muted);font-size:.85rem}
.std{margin:10px 0}
.std .top{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.panel details{border-bottom:1px solid var(--line);padding:10px 0}
.panel details:last-child{border-bottom:0}
.panel summary{cursor:pointer}
.panel p{margin:6px 0 0;color:var(--muted)}
.opt{text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);width:100%;margin-top:8px;padding:12px 14px}
.opt:hover{background:#faf7f1;filter:none}
.opt.right{background:#e3f1e6;border-color:var(--good);color:#1f4d2c}
.opt.wrong{background:#f8e4d6;border-color:var(--warn);color:#7a3d10}
.feedback{margin-top:12px;font-weight:600}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Virginia Studies Practice</h1>
  <div id="hdr"></div>
</header>

{id:"vs3", title:"Jamestown & Early Settlement", cards:[
["What kind of venture was the founding of Jamestown?","An economic venture","It was started to make money."],

const STORE_KEY = "jamestown-flashcards-v1"; // same key so existing profiles keep their progress
const COLORS = ["#8a4b2a","#3f7d4e","#2f5d8a","#8a2f6b","#b5651d","#5b4b8a"];

/* Flatten all cards. Each card has a stable key like "vs3-0". */
const ALL = [];
const TOPIC = {};
TOPICS.forEach(t => {
  TOPIC[t.id] = t;
  t.cards.forEach((c,i) => ALL.push({key:t.id+"-"+i, t:t.id, q:c[0], a:c[1], h:c[2]}));
});
const BY_KEY = Object.fromEntries(ALL.map(c => [c.key, c]));

/* ==========================================================
   STORAGE
   ========================================================== */
let db = load();
function load(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){}
  if(!d || !d.profiles) return {profiles:{}, activeId:null};
  // migrate old numeric card ids (1-100, Jamestown) to the new keys ("vs3-0" ...)
  for(const p of Object.values(d.profiles)){
    p.progress = p.progress || {};
    p.days = p.days || [];
    p.quizzes = p.quizzes || [];
    const np = {};
    for(const [k,v] of Object.entries(p.progress)){
      np[/^\d+$/.test(k) ? "vs3-"+(Number(k)-1) : k] = v;
    }
    p.progress = np;
  }
  return d;
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function prof(){ return db.profiles[db.activeId]; }
function gp(){ return prof().progress; }
function stOf(key){ return gp()[key] || {status:"new", right:0, wrong:0}; }
function dayKey(d){ return d.toLocaleDateString("en-CA"); }
function touchDay(){
  const days = prof().days;
  const t = dayKey(new Date());
  if(!days.includes(t)) days.push(t);
}
function mark(key, ok){
  const p = gp();
  const c = p[key] || {status:"new", right:0, wrong:0};
  if(ok){ c.status = "known"; c.right++; } else { c.status = "learning"; c.wrong++; }
  c.last = Date.now();
  p[key] = c;
  touchDay();
}
function streak(){
  const days = new Set(prof().days);
  const d = new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  let n = 0;
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ==========================================================
   HELPERS
   ========================================================== */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function topicKnown(tid){ return TOPIC[tid].cards.reduce((n,_,i)=> n + (stOf(tid+"-"+i).status==="known"?1:0), 0); }
function topicSize(tid){ return TOPIC[tid].cards.length; }
function scopeLabel(s){
  if(s==="all") return "Mixed review (all topics)";
  if(s==="missed") return "Missed cards only";
  return TOPIC[s] ? TOPIC[s].title : "";
}
function inScope(){
  return ALL.filter(c =>
    scope==="all" ? true :
    scope==="missed" ? stOf(c.key).status==="learning" :
    c.t===scope);
}
function missedCount(){ return ALL.filter(c => stOf(c.key).status==="learning").length; }

/* ==========================================================
   STATE
   ========================================================== */
let view = "profiles", tab = "topics", scope = "all";
let deck = [], flipped = false, hintOn = false;
let qz = null; // quiz state

function resetStudy(){
  deck = shuffle(inScope().filter(c => scope==="missed" || stOf(c.key).status!=="known").map(c=>c.key));
  flipped = false; hintOn = false;
}
function startQuiz(){
  const pool = shuffle(inScope()).slice(0, 10);
  qz = {list: pool.map(c=>c.key), i:0, score:0, opts:[], ans:null, done:false};
  if(pool.length) buildOpts();
}
function buildOpts(){
  const c = BY_KEY[qz.list[qz.i]];
  const sameTopic = shuffle(ALL.filter(x => x.t===c.t && x.a!==c.a));
  const others = shuffle(ALL.filter(x => x.t!==c.t && x.a!==c.a));
  const seen = new Set([c.a]); const picks = [];
  for(const x of sameTopic.concat(others)){
    if(picks.length>=3) break;
    if(!seen.has(x.a)){ seen.add(x.a); picks.push(x.a); }
  }
  qz.opts = shuffle([c.a, ...picks]);
  qz.ans = null;
}
function answerQuiz(idx){
  if(!qz || qz.done || qz.ans!==null) return;
  const c = BY_KEY[qz.list[qz.i]];
  qz.ans = idx;
  const ok = qz.opts[idx] === c.a;
  if(ok) qz.score++;
  mark(c.key, ok);
  save();
}
function nextQuiz(){
  qz.i++;
  if(qz.i >= qz.list.length){
    qz.done = true;
    prof().quizzes.unshift({date:Date.now(), scope, score:qz.score, total:qz.list.length});
    prof().quizzes = prof().quizzes.slice(0,30);
    save();
  } else buildOpts();
}
function grade(ok){
  const key = deck[0];
  mark(key, ok);
  deck.shift();
  if(!ok) deck.push(key);
  flipped = false; hintOn = false;
  save();
}

/* ==========================================================
   RENDER
   ========================================================== */
const app = document.getElementById("app");
const hdr = document.getElementById("hdr");

function render(){
  if(!db.activeId || !db.profiles[db.activeId]) view = "profiles";
  if(view==="profiles"){ hdr.innerHTML=""; renderProfiles(); return; }
  const p = prof();
  hdr.innerHTML = `<span class="row" style="margin:0"><span class="avatar" style="background:${p.color};width:30px;height:30px;font-size:.9rem">${esc(p.name[0].toUpperCase())}</span><strong>${esc(p.name)}</strong></span>
    <button class="ghost" data-act="switch">Switch profile</button>`;
  const tabs = [["topics","Topics"],["study","Flashcards"],["quiz","Quiz"],["progress","Progress"]];
  const nav = `<div class="tabs">${tabs.map(([k,l]) =>
    `<button class="${tab===k?'on':''}" data-act="tab" data-tab="${k}">${l}</button>`).join("")}</div>`;
  const body = tab==="topics" ? renderTopics() : tab==="study" ? renderStudy() : tab==="quiz" ? renderQuiz() : renderProgress();
  app.innerHTML = nav + body;
}

function renderProfiles(){
  const ids = Object.keys(db.profiles);
  app.innerHTML = `
    <h2>Who's studying?</h2>
    ${ids.length ? `<div class="profiles">${ids.map(id => {
      const p = db.profiles[id];
      const known = ALL.filter(c => (p.progress[c.key]||{}).status==="known").length;
      return `<div class="pcard">
        <button class="pick" data-act="pick" data-id="${id}">
          <span class="avatar" style="background:${p.color}">${esc(p.name[0].toUpperCase())}</span>
          <span>${esc(p.name)}<small>${known}/${ALL.length} mastered</small></span>
        </button>
        <button class="del" data-act="del" data-id="${id}" title="Delete profile">✕</button>
      </div>`;}).join("")}</div>` : `<div class="empty">No profiles yet. Create one below.</div>`}
    <form class="row" id="newp">
      <input name="pname" placeholder="New profile name" maxlength="24" required>
      <button type="submit">Add profile</button>
    </form>
    <div class="row">
      <button class="ghost" data-act="export">Export all data</button>
      <label class="btnlike ghost" style="cursor:pointer">Import<input type="file" id="imp" accept="application/json" hidden></label>
    </div>`;
}

function renderTopics(){
  const totalKnown = ALL.filter(c => stOf(c.key).status==="known").length;
  const pct = Math.round(totalKnown/ALL.length*100);
  return `
    <div class="meta"><span>${totalKnown}/${ALL.length} cards mastered across the year</span><span>${pct}%</span></div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div class="row">
      <button data-act="scope" data-s="all">Mixed review (all ${ALL.length})</button>
      <button class="ghost" data-act="scope" data-s="missed">Review missed (${missedCount()})</button>
    </div>
    <h2 style="margin-top:18px">Study topics</h2>
    <div class="grid">${TOPICS.map((t,n) => {
      const k = topicKnown(t.id), total = topicSize(t.id), p = Math.round(k/total*100);
      return `<div class="topic">
        <div class="top"><span>Topic ${n+1}</span><span>${k}/${total}</span></div>
        <h3>${esc(t.title)}</h3>
        <div class="bar"><span style="width:${p}%"></span></div>
        <div class="actions">
          <button data-act="studyTopic" data-s="${t.id}">Flashcards</button>
          <button class="ghost" data-act="quizTopic" data-s="${t.id}">Quiz</button>
        </div>
      </div>`;}).join("")}</div>`;
}

function scopeSelect(){
  const opts = [
    `<option value="all" ${scope==="all"?"selected":""}>Mixed review (all topics)</option>`,
    `<option value="missed" ${scope==="missed"?"selected":""}>Missed cards only</option>`,
    ...TOPICS.map(t => `<option value="${t.id}" ${scope===t.id?"selected":""}>${esc(t.title)}</option>`)
  ].join("");
  return `<select id="scope">${opts}</select>`;
}

function renderStudy(){
  const list = inScope();
  const known = list.filter(c => stOf(c.key).status==="known").length;
  const pct = list.length ? Math.round(known/list.length*100) : 0;
  let body;
  if(list.length===0){
    body = `<div class="empty">No cards here yet. Missed cards will appear after you mark some as "Need practice."</div>`;
  } else if(deck.length===0){
    body = `<div class="card" style="text-align:center">
      <p class="text">Round complete. ${known}/${list.length} mastered in this set.</p>
      <div class="row" style="justify-content:center"><button data-act="again">Start a new round</button>
      <button class="ghost" data-act="quizTopic" data-s="${scope}">Take a quiz instead</button></div>
    </div>`;
  } else {
    const c = BY_KEY[deck[0]];
    body = `
      <div class="card">
        <div class="label">${esc(TOPIC[c.t].title)}</div>
        <p class="text">${esc(c.q)}</p>
        ${!flipped ? `
          ${hintOn ? `<p class="hint">Hint: ${esc(c.h)}</p>` : ""}
          <div class="actions">
            <button class="ghost" data-act="hint">${hintOn?'Hide hint':'Show hint'}</button>
            <button data-act="reveal">Show answer</button>
          </div>` : `
          <div class="label">Answer</div>
          <p class="text" style="color:var(--accent)">${esc(c.a)}</p>
          <div class="actions">
            <button class="danger" data-act="grade" data-ok="0">Need practice</button>
            <button class="good" data-act="grade" data-ok="1">Got it</button>
          </div>`}
      </div>
      <div class="meta"><span>Space to flip · 1 = need practice · 2 = got it</span><span>${deck.length} left this round</span></div>`;
  }
  return `
    <div class="row between">${scopeSelect()}<span class="tag">${esc(scopeLabel(scope))}</span></div>
    <div class="meta"><span>${known}/${list.length} mastered in this set</span><span>${pct}%</span></div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div style="margin-top:16px">${body}</div>`;
}

function renderQuiz(){
  const list = inScope();
  let body;
  if(list.length===0){
    body = `<div class="empty">No cards in this set yet.</div>`;
  } else if(!qz || (qz.list.length===0)){
    body = `<div class="empty">Nothing to quiz here.</div>`;
  } else if(qz.done){
    const pct = Math.round(qz.score/qz.list.length*100);
    body = `<div class="card" style="text-align:center">
      <p class="text">You scored ${qz.score} of ${qz.list.length} (${pct}%).</p>
      <div class="row" style="justify-content:center"><button data-act="retake">Take another quiz</button>
      <button class="ghost" data-act="tab" data-tab="progress">See progress</button></div>
    </div>`;
  } else {
    const c = BY_KEY[qz.list[qz.i]];
    const answered = qz.ans!==null;
    body = `
      <div class="card">
        <div class="label">Question ${qz.i+1} of ${qz.list.length} · ${esc(TOPIC[c.t].title)}</div>
        <p class="text">${esc(c.q)}</p>
        ${qz.opts.map((o,i) => {
          let cls = "";
          if(answered){
            if(o===c.a) cls = "right";
            else if(i===qz.ans) cls = "wrong";
          }
          return `<button class="opt ${cls}" data-act="ans" data-i="${i}" ${answered?"disabled":""}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`;
        }).join("")}
        ${answered ? `<div class="feedback">${qz.opts[qz.ans]===c.a ? "Correct!" : "Not quite. The answer is highlighted above."}</div>
          <div class="actions"><button data-act="qnext">${qz.i+1<qz.list.length?"Next question":"See results"}</button></div>` : ""}
      </div>
      <div class="meta"><span>Keys: 1–4 to answer, Enter for next</span><span>Score: ${qz.score}</span></div>`;
  }
  return `
    <div class="row between">${scopeSelect()}<span class="tag">${esc(scopeLabel(scope))}</span></div>
    <div class="row"><button data-act="retake">${qz && !qz.done ? "Restart quiz" : "Start quiz"}</button>
      <span class="meta" style="margin:0">Up to 10 random questions</span></div>
    <div style="margin-top:12px">${body}</div>`;
}

function renderProgress(){
  const p = gp();
  const statuses = ALL.map(c => (p[c.key]||{}).status || "new");
  const knownN = statuses.filter(s=>s==="known").length;
  const learnN = statuses.filter(s=>s==="learning").length;
  const newN = statuses.filter(s=>s==="new").length;
  const answers = Object.values(p).reduce((n,x)=>n+(x.right||0)+(x.wrong||0),0);
  const pct = Math.round(knownN/ALL.length*100);

  const topicRows = TOPICS.map(t => {
    const k = topicKnown(t.id), total = topicSize(t.id), sp = Math.round(k/total*100);
    return `<div class="std">
      <div class="top"><span>${esc(t.title)}</span><span>${k}/${total}</span></div>
      <div class="bar"><span style="width:${sp}%"></span></div></div>`;
  }).join("");

  const needs = ALL.filter(c => (p[c.key]||{}).status==="learning");
  const needsHtml = needs.length ? `<div class="panel">${needs.map(c=>`
      <details><summary>${esc(c.q)} <span class="tag">${esc(TOPIC[c.t].title)}</span></summary><p><b>Answer:</b> ${esc(c.a)}</p></details>`).join("")}</div>`
    : `<div class="empty">Nothing is marked "need practice" right now.</div>`;

  const quizzes = (prof().quizzes||[]).slice(0,8);
  const quizHtml = quizzes.length ? `<div class="panel">${quizzes.map(q=>`
      <details><summary>${new Date(q.date).toLocaleDateString()} · ${esc(scopeLabelFor(q.scope))} · ${q.score}/${q.total}</summary></details>`).join("")}</div>`
    : `<div class="empty">No quizzes taken yet.</div>`;

  return `
    <div class="stats">
      <div class="stat"><b>${pct}%</b><span>Mastered (${knownN}/${ALL.length})</span></div>
      <div class="stat"><b>${learnN}</b><span>Need practice</span></div>
      <div class="stat"><b>${newN}</b><span>Not yet studied</span></div>
      <div class="stat"><b>${streak()}</b><span>Day streak</span></div>
      <div class="stat"><b>${answers}</b><span>Answers given</span></div>
    </div>
    <h2>By topic</h2>
    ${topicRows}
    <h2 style="margin-top:24px">Review these</h2>
    ${needsHtml}
    <h2 style="margin-top:24px">Recent quizzes</h2>
    ${quizHtml}
    <div class="row" style="margin-top:24px">
      <button class="danger" data-act="reset">Reset this profile's progress</button>
    </div>`;
}
function scopeLabelFor(s){ return s==="all" ? "Mixed review" : s==="missed" ? "Missed cards" : (TOPIC[s]?TOPIC[s].title:""); }

/* ==========================================================
   EVENTS
   ========================================================== */
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  const a = el.dataset.act;
  if(a==="pick"){ db.activeId = el.dataset.id; save(); view="main"; tab="topics"; scope="all"; }
  else if(a==="del"){
    const p = db.profiles[el.dataset.id];
    if(confirm(`Delete profile "${p.name}" and all its progress?`)){
      delete db.profiles[el.dataset.id];
      if(db.activeId===el.dataset.id) db.activeId = null;
      save();
    }
  }
  else if(a==="switch"){ db.activeId=null; save(); view="profiles"; }
  else if(a==="tab"){ tab = el.dataset.tab; if(tab==="study") resetStudy(); if(tab==="quiz" && !qz) startQuiz(); }
  else if(a==="scope"){ scope = el.dataset.s; tab="study"; resetStudy(); }
  else if(a==="studyTopic"){ scope = el.dataset.s; tab="study"; resetStudy(); }
  else if(a==="quizTopic"){ scope = el.dataset.s; tab="quiz"; startQuiz(); }
  else if(a==="reveal"){ flipped = true; }
  else if(a==="hint"){ hintOn = !hintOn; }
  else if(a==="grade"){ grade(el.dataset.ok==="1"); }
  else if(a==="again"){ resetStudy(); }
  else if(a==="ans"){ answerQuiz(Number(el.dataset.i)); }
  else if(a==="qnext"){ nextQuiz(); }
  else if(a==="retake"){ startQuiz(); }
  else if(a==="reset"){
    if(confirm("Reset all progress for this profile?")){
      prof().progress = {}; prof().days = []; prof().quizzes = []; save();
      resetStudy(); startQuiz();
    }
  }
  else if(a==="export"){
    const blob = new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const link = Object.assign(document.createElement("a"),{href:url,download:"virginia-studies-backup.json"});
    link.click(); URL.revokeObjectURL(url);
  }
  render();
});

app.addEventListener("submit", e => {
  if(e.target.id !== "newp") return;
  e.preventDefault();
  const name = e.target.elements.pname.value.trim();
  if(!name) return;
  const id = uid();
  const n = Object.keys(db.profiles).length;
  db.profiles[id] = {name, color: COLORS[n % COLORS.length], progress:{}, days:[], quizzes:[], created:Date.now()};
  db.activeId = id; save(); view="main"; tab="topics"; scope="all";
  render();
});

app.addEventListener("change", e => {
  if(e.target.id === "scope"){
    scope = e.target.value;
    if(tab==="study"){ resetStudy(); }
    if(tab==="quiz"){ startQuiz(); }
    render();
  }
  if(e.target.id === "imp"){
    const f = e.target.files[0]; if(!f) return;
    f.text().then(t => {
      const d = JSON.parse(t);
      if(!d || !d.profiles) throw new Error("bad");
      // run the same migration on imported data
      for(const [id,p] of Object.entries(d.profiles)){
        p.progress = p.progress || {}; p.days = p.days || []; p.quizzes = p.quizzes || [];
        const np = {};
        for(const [k,v] of Object.entries(p.progress)) np[/^\d+$/.test(k) ? "vs3-"+(Number(k)-1) : k] = v;
        p.progress = np;
        db.profiles[id] = p;
      }
      save(); render();
    }).catch(() => alert("That file isn't a valid backup."));
  }
});

document.addEventListener("keydown", e => {
  if(view!=="main") return;
  if(["SELECT","INPUT","TEXTAREA"].includes(e.target.tagName)) return;
  if(tab==="study" && deck.length){
    if((e.key===" " || e.key==="Enter") && !flipped){ e.preventDefault(); flipped = true; render(); }
    else if(flipped && e.key==="1"){ grade(false); render(); }
    else if(flipped && e.key==="2"){ grade(true); render(); }
  }
  if(tab==="quiz" && qz && !qz.done && qz.list.length){
    const n = Number(e.key);
    if(qz.ans===null && n>=1 && n<=qz.opts.length){ answerQuiz(n-1); render(); }
    else if(qz.ans!==null && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); nextQuiz(); render(); }
  }
});

if(db.activeId && db.profiles[db.activeId]){ view="main"; tab="topics"; }
render();
</script>
